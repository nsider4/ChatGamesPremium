enable-races: true

creative-enabled: true
#Useful Links to add DATA:
#
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html
#https://helpch.at/docs/1.8/index.html?org/bukkit/entity/EntityType.html
#https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
#https://helpch.at/docs/1.8/org/bukkit/Material.html

#Names can be modern or legacy (MOOSHROOM or MUSHROOM_COW, COD or RAW_FISH): they are matched to your server's
#version. Names that don't exist on your version (e.g. a 1.21 block on 1.8) are skipped, with a console note.
#
#Each race also accepts (optional):
#  points: 1     #points the winner gets (default 1)
#  weight: 1     #how often the rotation picks it compared to other games (default 1, 0 = never)
#
#Admins can start a race with their own values: /chatgames <race> <material/mob> [amount]
#Without an amount, one listed below for that material/mob is used. The winner gets the rewards listed
#for exactly that material and amount, or none if they aren't listed here (points are still given).

hunt:
  enable: true

  timeToComplete_seconds: 180
  #__Leave the following 2 empty to disable them__
  titleMessage: '&bHUNT'
  subtitleMessage: '&aKill %amount% %value%!'

  #Whether to count mobs that were spawned by spawner blocks or spawn eggs.
  count-spawner-mobs: true
  #Whether MythicMobs mobs also count for the mob they are based on (a MythicMobs zombie as a ZOMBIE).
  count-mythic-mobs: true

  data:
    #These values have to be valid minecraft mobs IDs (see Useful Links at the top of the file)
    #With MythicMobs installed, mythic:<mob type> is one of its mobs (an example is at the end of this list)
    ZOMBIE:
      3:
        #THE SUM OF ALL CHANCES OF REWARDS YOU ADD CANNOT EXCEED 100%
        rewards:
          - reward_2
      5:
        rewards:
          - reward_1

