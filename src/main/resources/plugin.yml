name: ChatGames-Premium
author: Nsider
version: 2.0.0
main: org.nsider.chatgames.ChatGames
api-version: '1.13'
# All scheduling goes through ChatGamesScheduler, which uses Folia's region schedulers there
folia-supported: true
softdepend: [PlaceholderAPI, MythicMobs]


commands:
  chatgames:
    description: Main command
    aliases: [chatgame]
    usage: /<command>


permissions:
  chatgames.start.*:
    description: 'Allows starting any game or race, and starting games from disabled worlds.'
    default: op
    children:
      chatgames.start.unscramble: true
      chatgames.start.math: true
      chatgames.start.trivia: true
      chatgames.start.word_association: true
      chatgames.start.count: true
      chatgames.start.reaction: true
      chatgames.start.clickable: true
      chatgames.start.random: true
      chatgames.start.unreverse: true
      chatgames.start.variable: true
      chatgames.start.guess_the_number: true
      chatgames.start.memorize: true
      chatgames.start.sequence: true
      chatgames.start.fillout: true
      chatgames.start.hoverable: true
      chatgames.start.hunt: true
      chatgames.start.place: true
      chatgames.start.mine: true
      chatgames.start.fish: true
      chatgames.start.eat: true
      chatgames.start.craft: true
      chatgames.start.furnace: true
      chatgames.start.tame: true
      chatgames.start.shear: true
  chatgames.start.word_association:
    description: 'Allows starting word_association by command.'
    default: op
  chatgames.start.count:
    description: 'Allows starting count (always a global game) by command.'
    default: op
  chatgames.global:
    description: 'Allows starting a global game or race by command.'
    default: op
  chatgames.stop:
    description: 'Allows stopping the running game with no winner.'
    default: op
  chatgames.top:
    description: 'Allows viewing the top players by points.'
    default: true
  chatgames.fastesttop:
    description: 'Allows viewing the fastest players, overall or per game.'
    default: true
  chatgames.points:
    description: 'Allows checking your own points.'
    default: true
  chatgames.points.others:
    description: 'Allows checking another player''s points.'
    default: op
  chatgames.manage.points:
    description: 'Allows adding, removing and setting players'' points.'
    default: op
  chatgames.play:
    description: 'Allows playing chat games. Only checked when use-permission-toplay is true.'
    default: true
  chatgames.toggle:
    description: 'Allows toggling chat games on or off for yourself.'
    default: true
  chatgames.toggle.others:
    description: 'Allows toggling chat games on or off for another player.'
    default: op
  chatgames.togglesound:
    description: 'Allows toggling game sounds for yourself.'
    default: true
  chatgames.togglesound.others:
    description: 'Allows toggling game sounds for another player.'
    default: op
  chatgames.help:
    description: 'Allows viewing the command list.'
    default: true
  chatgames.reload:
    description: 'Allows reloading the configuration files.'
    default: op
  chatgames.toggleAll:
    description: 'Allows turning the automatic game rotation on or off.'
    default: op
  chatgames.preset:
    description: 'Allows listing, loading and saving game presets.'
    default: op
  chatgames.remove:
    description: 'Allows removing a player from the database.'
    default: op
  chatgames.logs:
    description: 'Allows viewing the game logs.'
    default: op
  chatgames.discord:
    description: 'Allows sending test messages and the leaderboard to Discord.'
    default: op
  chatgames.challenges:
    description: 'Allows viewing your daily and weekly challenges.'
    default: true
  chatgames.streaks:
    description: 'Allows viewing your streaks.'
    default: true
  chatgames.claim:
    description: 'Allows claiming finished challenges and streak rewards.'
    default: true
  chatgames.challenges.reset:
    description: 'Allows clearing a player''s challenge progress.'
    default: op
  chatgames.streaks.set:
    description: 'Allows setting a player''s streak.'
    default: op
  chatgames.event:
    description: 'Allows listing game events and viewing their leaderboards.'
    default: true
  chatgames.event.manage:
    description: 'Allows starting and stopping game events.'
    default: op
  chatgames.menu:
    description: 'Allows opening the main menu.'
    default: true
  chatgames.profile:
    description: 'Allows viewing your profile.'
    default: true
  chatgames.profile.others:
    description: 'Allows viewing another player''s profile.'
    default: true
  chatgames.admin:
    description: 'Allows opening the admin menu (each button still needs its command''s permission).'
    default: op
  chatgames.debug:
    description: 'Allows opening the debug menu to test games privately.'
    default: op
  chatgames.start.unscramble:
    description: 'Allows starting unscramble by command.'
    default: op
  chatgames.start.math:
    description: 'Allows starting math by command.'
    default: op
  chatgames.start.trivia:
    description: 'Allows starting trivia by command.'
    default: op
  chatgames.start.reaction:
    description: 'Allows starting reaction by command.'
    default: op
  chatgames.start.clickable:
    description: 'Allows starting clickable by command.'
    default: op
  chatgames.start.random:
    description: 'Allows starting random by command.'
    default: op
  chatgames.start.unreverse:
    description: 'Allows starting unreverse by command.'
    default: op
  chatgames.start.variable:
    description: 'Allows starting variable by command.'
    default: op
  chatgames.start.guess_the_number:
    description: 'Allows starting guess_the_number by command.'
    default: op
  chatgames.start.memorize:
    description: 'Allows starting memorize by command.'
    default: op
  chatgames.start.sequence:
    description: 'Allows starting sequence by command.'
    default: op
  chatgames.start.fillout:
    description: 'Allows starting fillout by command.'
    default: op
  chatgames.start.hoverable:
    description: 'Allows starting hoverable by command.'
    default: op
  chatgames.start.hunt:
    description: 'Allows starting hunt by command.'
    default: op
  chatgames.start.place:
    description: 'Allows starting place by command.'
    default: op
  chatgames.start.mine:
    description: 'Allows starting mine by command.'
    default: op
  chatgames.start.fish:
    description: 'Allows starting fish by command.'
    default: op
  chatgames.start.eat:
    description: 'Allows starting eat by command.'
    default: op
  chatgames.start.craft:
    description: 'Allows starting craft by command.'
    default: op
  chatgames.start.furnace:
    description: 'Allows starting furnace by command.'
    default: op
  chatgames.start.tame:
    description: 'Allows starting tame by command.'
    default: op
  chatgames.start.shear:
    description: 'Allows starting shear by command.'
    default: op
