    claim-all:
      slot: 40
      material: chest
      name: '&a&lClaim All'
      lore:
        - '&7Claims every finished challenge'
        - '&7and streak reward.'
    previous:
      slot: 39
      material: arrow
      name: '&7Previous page'
    next:
      slot: 41
      material: arrow
      name: '&7Next page &8(%page%/%pages%)'
