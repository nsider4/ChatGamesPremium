#############################
######    CHATGAMES    ######
#############################
#Settings every game accepts (a missing one uses the default shown):
#  enable: true/false
#  weight: 1             How likely the rotation is to pick this game compared to the others (0 = never).
#                        The same game never runs twice in a row.
#  winners: 1            How many players can win each round.
#  points: 1             Points per win (/chatgames top).
#  case-sensitive: false Players who are right except for capitalisation get the 'wrong_case' message.
#  timeToGuess_seconds: 20
#  min-answer-ms: 400    Correct answers faster than this are ignored and logged: nobody reads and types
#                        that fast, chat bots do. 0 turns the check off.
#  hints:                Hints appear while the round runs, using 'hint_message' in messages.yml.
#    enable: false
#    after-percent: 50   The first hint shows once this much of the time has passed; others are spread over the rest.
#    max: 1              Up to 3.
#  countdown:            Time left, on the action bar. Works on every version (1.8 to 26.x).
#    enable: false
#    last-seconds: 10    Only during the last N seconds; 0 shows it for the whole round.
#  titleMessage / subtitleMessage: leave both empty to send no title.
unscramble:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #The time users will have to guess, solve, write, etc in seconds.
  timeToGuess_seconds: 20
  #__Leave the following 2 empty to disable them__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aUnscramble'

