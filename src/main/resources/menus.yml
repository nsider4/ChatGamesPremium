      slot: 36
      material: arrow
      name: '&7Back'
    close:
      slot: 44
      material: barrier
      name: '&cClose'
  #%challenge% %description% %progress% %amount% %percent% %bar%; %icon% is the challenge's icon
  templates:
    in-progress:
      material: '%icon%'
      name: '%challenge%'
      lore:
        - '%description%'
        - ''
        - '%bar% &f%progress%&7/&f%amount%'
        - '&7In progress'
    ready:
      material: '%icon%'
      glow: true
      name: '%challenge% &a&l(DONE)'
      lore:
        - '%description%'
        - ''
        - '%bar% &f%progress%&7/&f%amount%'
        - '&a&lClick to claim your reward!'
    claimed:
      material: lime_stained_glass_pane
      name: '%challenge% &7(claimed)'
      lore:
        - '%description%'
        - ''
        - '&aReward claimed'

streaks:
  title: '&8Streaks'
  rows: 5
  filler:
    material: gray_stained_glass_pane
    name: ' '
  #The 7 slots of each streak's ladder, day 1 to 7 (8-14 in the second week...)
  ladders:
    challenge: [11, 12, 13, 14, 15, 16, 17]
    daily: [20, 21, 22, 23, 24, 25, 26]
    global: [29, 30, 31, 32, 33, 34, 35]
  items:
    #One per streak. %streak% %days% %longest% %unclaimed%; click to claim when there's something
    challenge:
      slot: 10
      material: writable_book
      name: '%streak%'
      lore:
        - '&7Complete every daily challenge each day.'
        - ''
        - '&7Current: &f%days% &7days &8(best %longest%)'
        - '&7Days to claim: &e%unclaimed%'
    daily:
      slot: 19
