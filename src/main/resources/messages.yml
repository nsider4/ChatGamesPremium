help_command:
  - '&7&m-------------------------------------------------'
  - '&e&l-ChatGames-'
  - '&6'
  - '&6&lCOMMANDS:'
  - '&6'
  - '&a/chatgames top &f- &3Shows the top 10 players with most points.'
  - '&a/chatgames fastest [game] &f- &3Shows the fastest winners, overall or for one game.'
  - '&a/chatgames points [player] &f- &3Shows your points (or another player''s).'
  - '&a/chatgames challenges &f- &3Shows your daily and weekly challenges.'
  - '&a/chatgames streaks &f- &3Shows your streaks.'
  - '&a/chatgames claim &f- &3Claims finished challenges and streak rewards.'
  - '&a/chatgames toggle [player] &f- &3Turns chat games on or off for you.'
  - '&a/chatgames togglesound [player] &f- &3Turns chat game sounds on or off.'
  - '&6'
  - '&c&lADMIN:'
  - '&a/chatgames (game) [values] &f- &3Starts that game now, optionally with your own word/values.'
  - '&a/chatgames any &f- &3Starts the game the rotation would pick next.'
  - '&a/chatgames global <game> [values] &f- &3Starts a global game: everyone who answers in time wins.'
  - '&a/chatgames stop &f- &3Ends the running game with no winner.'
  - '&a/chatgames toggleAll &f- &3Turns the automatic game rotation on or off.'
  - '&a/chatgames preset <list|load|save> [name] &f- &3Manages game presets.'
  - '&a/chatgames +points|-points|setpoints <player> <amount> &f- &3Changes a player''s points.'
  - '&a/chatgames remove <player> &f- &3Deletes a player''s data.'
  - '&a/chatgames challenges reset <player> &f- &3Clears a player''s challenge progress.'
  - '&a/chatgames streak set <player> <challenge|daily|global> <days> &f- &3Sets a player''s streak.'
  - '&a/chatgames logs [amount] &f- &3Shows the last game logs.'
  - '&a/chatgames reload &f- &3Reloads the configuration files.'
  - '&6'
  - '&2&lGAME TYPES:'
  - '&5unscramble, unreverse, reaction, random, fillout, variable, clickable, math, sequence, memorize, guess_the_number, trivia, word_association, hoverable, hunt, mine, place, fish, craft, eat, furnace'
  - '&7&m-------------------------------------------------'

#Use <center> in LIST messages to center the messages, the lines with this will be centered!

#############################
##    CHATGAME MESSAGES    ##
#############################
#Shared by every game. A game can override them with its own 'hint_message' / 'countdown_actionbar' in its section below.
hint_message: '&8[%prefix%&8] &eHint: &f%hint%'
countdown_actionbar: '&e%seconds%s &7left'

waiting_for_other_winners: '&8[%prefix%&8] &aYou got it right! &fWaiting for other winners...'
wrong_case: '&8[%prefix%&8] &cAlmost... Check your capitalization!'
  #YOU CAN USE "%display_name%" AS A REPLACEMENT FOR %player% IN correct_message FOR ALL GAMES.
  #
  #YOU CAN ALSO USE %points_<position>% TO SHOW THE POINTS FOR THE PLAYER THAT WON.
  #
  #To display 1st, 2nd, 3rd winners, and so on use: %winner_<position>% and for time taken for each use %time_<position>%

  ##EXAMPLE 2 WINNERS SCENARIO:
  #
  #correct_message:
  #- ''
  #- '<center>&r✓ ✯ %prefix% &r✯ ✓'
  #- ''
  #- '&7The correct answer was `&e%correct_answer%&7`! The winners are:'
