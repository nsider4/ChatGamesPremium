      name: '%streak%'
      lore:
        - '&7Solve a global game each day.'
        - ''
        - '&7Current: &f%days% &7days &8(best %longest%)'
        - '&7Days to claim: &e%unclaimed%'
    back:
      slot: 36
      material: arrow
      name: '&7Back'
    close:
      slot: 44
      material: barrier
      name: '&cClose'
  #%day% is the streak day; %ladder_day% its reward day (1-7). Today's day shines.
  templates:
    day-claimed:
      material: lime_stained_glass_pane
      name: '&aDay %day% &7(claimed)'
    day-ready:
      material: chest
      name: '&e&lDay %day%'
      lore:
