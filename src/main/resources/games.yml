#In this game, a string of the length specified will be created with random characters
random:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: true
  #The time users will have to guess, solve, write, etc in seconds.
  timeToGuess_seconds: 20
  #The length of the string that will randomly generate for this game. Range format <lower>-<higher>. If you want only one length use the same number on both sides
  lengthRange: 6-8
  #Types available: ALPHA (letters), ALPHANUMERIC (letters and numbers), NUMERIC (numbers), SYMBOLIC (symbols),
  #LOWERCASE_ALPHA (all lowercase letters), UPPERCASE_ALPHA (all uppercase letters), HEXADECIMAL (hexadecimal chars: 0123456789ABCDEF)
  #CUSTOM (Uses whatever is at 'custom_characters')
  character_type: ALPHANUMERIC
  #Only if type is "CUSTOM" this line will be used
  custom_characters: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'

  #__Leave the following 2 empty to disable them__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aWrite'

math:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Don't change this
  case-sensitive: false
  #The time users will have to guess, solve, write, etc in seconds.
  timeToGuess_seconds: 20
  #Difficulty random number ranges:
  #1 - (1-9)
  #2 - (1-99)
  #3 - (1-999)
  #4 - (1-9999)
  #5 - (1-99999)
  difficulty: 2
  #How many operators each question has: 1 -> "12 + 7", 2 -> "12 + 7 x 3"
  operations: 1
  #solve: work out the result ("12 + 7 x 3").  missing-value: find the hidden number ("12 + ? x 3 = 33").
  #Each round picks one of the listed modes.
  modes:
    - solve
    - missing-value
  #Operators to use, the four listed are the ones available, you can remove if you don't want to use all of them. Always leave at least 1
  #Divisions always come out as whole numbers.
  operators:
    - '+'
    - '-'
    - 'x'
    - '/'

  #__Leave the following 2 empty to disable them__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aSolve'

variable:
  enable: true
  winners: 1
  weight: 1
  points: 1
  countdown:
    enable: true
    last-seconds: 10

  #Don't change this
  case-sensitive: false
  #The time users will have to guess, solve, write, etc in seconds.
  timeToGuess_seconds: 20

  #__Leave the following 2 empty to disable them__
  titleMessage: '&bSOLVE'
  subtitleMessage: '&aFor &7`&b%symbol%&7`'

  #The range of the random result number
  result-min: 20
  result-max: 100

  toGet: '✗'
  #Here are some other symbols you can use to add: ✪❃✿✠❂♫♪❦♡♤♢✦☾☽✹
  data:
    - '✯;10'
    - '♛;15'
    - '❅;20'
    - '♫;25'

sequence:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  #Don't change this
  case-sensitive: false

  #The time users will have to guess, solve, write, etc in seconds.
  timeToGuess_seconds: 25

  #Players see a number sequence and type the next number, e.g. "3, 6, 12, 24, ?" -> 48
  #Patterns: add (3, 7, 11), multiply (2, 6, 18), squares (4, 9, 16), alternating (5, 9, 7, 11), fibonacci (2, 3, 5, 8)
  patterns:
    - add
    - multiply
    - squares
    - alternating
    - fibonacci
  #1-3. Higher difficulty allows harder patterns (squares and alternating from 2, fibonacci at 3) and bigger numbers.
  difficulty: 2
  #How many numbers are shown before the '?' (4-8)
  shown-terms: 5

  #__Leave the following 2 empty to disable them__
  titleMessage: '&b%selection%'
  subtitleMessage: '&aComplete the sequence'

memorize:
  enable: true
  winners: 1
  weight: 1
  points: 1
  hints:
    enable: true
    after-percent: 50
    max: 1
  countdown:
    enable: true
    last-seconds: 10

  case-sensitive: false

  listLength: 3
  #Each round takes its items from one of these pools (see words.yml -> memorize.pools):
  #shopping_list, words, colors, numbers, blocks, mobs, or a list of your own
  pools:
    - shopping_list
    - words
    - colors
    - numbers
    - blocks
    - mobs
  #If false, the items can be typed in any order
  order-matters: true

  #The time users will have to memorize, solve, write, etc in seconds.
  timeToMemorize: 7

  #The time users will have to guess, solve, write, etc in seconds.
  timeToGuess_seconds: 20
  #Leave the following 2 empty to disable them
  titleMessage: '&bMemorize'
  subtitleMessage: '&aTry remembering this list!'

