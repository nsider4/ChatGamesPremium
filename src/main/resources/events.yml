#GAME EVENTS
#
#An event is a series of games played back to back. Each game hands out event points by
#place; when the last one ends, the players with the most event points win the event's
#rewards. While an event runs, the normal game rotation and global games wait.
#
#Start one with /chatgames event start <event>, or let its schedule start it.
#/chatgames event top <event> shows who has scored the most in it over time.
#
#Every event:
#  name: shown to players (colour codes work)
#  schedule: when it starts by itself, e.g. 'SATURDAY 20:00' or 'DAILY 18:30' (or leave it out).
#            The time zone is the one in challenges.yml.
#  minimum-players: players needed online for the schedule to start it (the command ignores this)
#  pause-seconds: seconds between one game ending and the next starting
#  points: event points for 1st, 2nd, 3rd... in each game
#  participation-points: event points for anyone else who makes it. In a global game, if the
#                        server reaches the goal, everyone who contributed enough scores:
#                        'points' for the biggest contributors, these for the rest.
#                        If the goal isn't reached, nobody scores that game.
#  steps: the games, in order. Each one:
#    game: the game or race, as in games.yml / races.yml
#    global: true to play it as a global game (the server plays together; see global_games.yml).
#            Count is always global.
#    time: seconds to answer (or to finish a race), instead of the game's own
#    winners: how many can win a normal chat game, instead of the game's own
#    args: the values, as after /chatgames <game>, e.g. 'stone 16' for a mine race
#    settings: any other games.yml values to change for this game, e.g. {difficulty: hard}
#  rewards: reward lines by final place (1, 2, 3...), and 'participation' for everyone else
#           who scored. The same lines as rewards.yml ('<chance>%~ ' and 'has:<permission>' work).

events:
  weekend_cup:
    name: '&6&lWeekend Cup'
    schedule:
      - 'SATURDAY 20:00'
    minimum-players: 3
    pause-seconds: 15
    points: [5, 3, 1]
    participation-points: 1
    steps:
      - game: unscramble
        winners: 3
      - game: math
        winners: 3
        time: 25
      - game: word_association
        global: true
        settings:
          difficulty: hard
      - game: trivia
        winners: 3
      - game: mine
        global: true
        time: 120
        args: 'stone 100'
    rewards:
      1:
        - '[consolecmd] give %player% diamond 5'
      2:
        - '[consolecmd] give %player% diamond 3'
      3:
        - '[consolecmd] give %player% diamond 1'
      participation:
        - '[consolecmd] give %player% iron_ingot 3'

  quick_quiz:
    name: '&b&lQuick Quiz'
    minimum-players: 2
    pause-seconds: 8
    points: [3, 2, 1]
    participation-points: 0
    steps:
      - game: reaction
        winners: 3
      - game: unscramble
        winners: 3
      - game: math
        winners: 3
    rewards:
      1:
        - '[consolecmd] give %player% gold_ingot 5'

messages:
  #To everyone. %event% is its name, %steps% how many games, %pause% the seconds between them.
  start:
    - ''
    - '&6&l» EVENT: %event% &fis starting! &e%steps% &fgames, the most event points wins.'
    - ''
  #Before each game. %step% is its number, %game% the game.
  step:
    - '&6&l» %event% &f- game &e%step%/%steps%&f: &e%game%'
  #Instead, when another game (e.g. a global game) is still running; the step starts once it ends.
  waiting:
    - '&6&l» %event% &f- game &e%step%/%steps% &fstarts when the current game ends.'
  #To each player who scores in a game. %points% what they earned, %total% their event total.
  step_points: '&8[%prefix%&8] &a+%points% event points &7(%total% in total)'
  #To everyone at the end. %count% players scored; %winner_<n>% and %points_<n>% the first three.
  end:
    - ''
    - '&6&l» %event% &fis over! &e%count% &fplayer(s) scored.'
    - '&f  1. &e%winner_1% &7%points_1%  &f2. &e%winner_2% &7%points_2%  &f3. &e%winner_3% &7%points_3%'
    - ''
  nobody:
    - '&6&l» %event% &fis over! &cNobody scored.'
  #To each player who scored, after the end. %place% of %count%.
  result: '&8[%prefix%&8] &fYou finished &e#%place% &fof %count% with &e%points% &fevent points.'
  stopped:
    - '&6&l» %event% &chas been stopped.'

#Event starts and final standings are posted to Discord as set in discord.yml.
